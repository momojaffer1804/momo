<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoMo Eye Studio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101010;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .preview {
            background: black;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        canvas {
            width: 100%;
            max-width: 700px;
            height: auto;
            image-rendering: pixelated;
            background: black;
        }

        h2 {
            margin-top: 30px;
        }

        .presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .preset {
            background: #1c1c1c;
            border: 2px solid #2d2d2d;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: 0.15s;
        }

        .preset:hover {
            border-color: #777;
            transform: translateY(-2px);
        }

        .preset.active {
            border-color: white;
        }

        .preset-preview {
            background: black;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .preset-preview canvas {
            width: 100%;
        }

        .preset-name {
            font-weight: bold;
        }

        .preset-description {
            color: #777;
            font-size: 12px;
            margin-top: 4px;
        }

        .controls {
            margin-top: 30px;
            background: #1c1c1c;
            border-radius: 15px;
            padding: 25px;
        }

        .control {
            margin-bottom: 20px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
        }

        input[type="range"] {
            width: 100%;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .reset {
            background: #333;
            color: white;
        }

        .send {
            background: white;
            color: black;
        }

        @media (max-width: 700px) {
            .presets {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>MoMo Eye Studio 👀</h1>
    <div class="subtitle">
        Design and test MoMo expressions
    </div>


    <!-- MAIN PREVIEW -->

    <div class="preview">

        <canvas
            id="mainCanvas"
            width="128"
            height="64">
        </canvas>

    </div>


    <!-- PRESETS -->

    <h2>Expressions</h2>

    <div class="presets" id="presetContainer"></div>


    <!-- CUSTOM CONTROLS -->

    <div class="controls">

        <h2>Customize</h2>


        <div class="control">
            <div class="control-header">
                <span>Eye Width</span>
                <span id="eyeWidthValue">38</span>
            </div>

            <input
                type="range"
                id="eyeWidth"
                min="10"
                max="60"
                value="38">
        </div>


        <div class="control">
            <div class="control-header">
                <span>Eye Height</span>
                <span id="eyeHeightValue">30</span>
            </div>

            <input
                type="range"
                id="eyeHeight"
                min="4"
                max="45"
                value="30">
        </div>


        <div class="control">
            <div class="control-header">
                <span>Corner Radius</span>
                <span id="cornerRadiusValue">8</span>
            </div>

            <input
                type="range"
                id="cornerRadius"
                min="0"
                max="20"
                value="8">
        </div>


        <div class="control">
            <div class="control-header">
                <span>Pupil Size</span>
                <span id="pupilSizeValue">7</span>
            </div>

            <input
                type="range"
                id="pupilSize"
                min="0"
                max="12"
                value="7">
        </div>


        <div class="control">
            <div class="control-header">
                <span>Eye Spacing</span>
                <span id="eyeSpacingValue">50</span>
            </div>

            <input
                type="range"
                id="eyeSpacing"
                min="25"
                max="80"
                value="50">
        </div>


        <div class="control">
            <div class="control-header">
                <span>X Position</span>
                <span id="eyeCenterXValue">64</span>
            </div>

            <input
                type="range"
                id="eyeCenterX"
                min="35"
                max="93"
                value="64">
        </div>


        <div class="control">
            <div class="control-header">
                <span>Y Position</span>
                <span id="eyeCenterYValue">33</span>
            </div>

            <input
                type="range"
                id="eyeCenterY"
                min="15"
                max="50"
                value="33">
        </div>


        <div class="buttons">

            <button
                class="reset"
                onclick="resetExpression()">
                Reset
            </button>

            <button
                class="send"
                onclick="sendToMoMo()">
                Send to MoMo
            </button>

        </div>

    </div>

</div>


<script>


// =====================================================
// CURRENT EXPRESSION
// =====================================================

let currentExpression = {

    eyeWidth: 38,
    eyeHeight: 30,
    cornerRadius: 8,
    pupilSize: 7,
    eyeSpacing: 50,
    eyeCenterX: 64,
    eyeCenterY: 33
};


// =====================================================
// PRESETS
// =====================================================

const presets = {

    neutral: {
        name: "Neutral",
        description: "Default MoMo expression",

        eyeWidth: 38,
        eyeHeight: 30,
        cornerRadius: 8,
        pupilSize: 7,
        eyeSpacing: 50,
        eyeCenterX: 64,
        eyeCenterY: 33
    },


    happy: {
        name: "Happy",
        description: "Friendly / cheerful",

        eyeWidth: 38,
        eyeHeight: 18,
        cornerRadius: 12,
        pupilSize: 5,
        eyeSpacing: 50,
        eyeCenterX: 64,
        eyeCenterY: 31
    },


    angry: {
        name: "Angry",
        description: "Alert / annoyed",

        eyeWidth: 38,
        eyeHeight: 22,
        cornerRadius: 5,
        pupilSize: 6,
        eyeSpacing: 50,
        eyeCenterX: 64,
        eyeCenterY: 31
    },


    sleepy: {
        name: "Sleepy",
        description: "Tired / idle",

        eyeWidth: 38,
        eyeHeight: 10,
        cornerRadius: 5,
        pupilSize: 4,
        eyeSpacing: 50,
        eyeCenterX: 64,
        eyeCenterY: 34
    },


    surprised: {
        name: "Surprised",
        description: "Unexpected event",

        eyeWidth: 25,
        eyeHeight: 40,
        cornerRadius: 12,
        pupilSize: 6,
        eyeSpacing: 50,
        eyeCenterX: 64,
        eyeCenterY: 33
    },


    thinking: {
        name: "Thinking",
        description: "Processing / deciding",

        eyeWidth: 38,
        eyeHeight: 25,
        cornerRadius: 8,
        pupilSize: 5,
        eyeSpacing: 50,
        eyeCenterX: 67,
        eyeCenterY: 32
    },


    sad: {
        name: "Sad",
        description: "Disappointed / goodbye",

        eyeWidth: 38,
        eyeHeight: 20,
        cornerRadius: 8,
        pupilSize: 5,
        eyeSpacing: 50,
        eyeCenterX: 64,
        eyeCenterY: 35
    },


    focused: {
        name: "Focused",
        description: "Listening / concentrating",

        eyeWidth: 34,
        eyeHeight: 34,
        cornerRadius: 6,
        pupilSize: 5,
        eyeSpacing: 48,
        eyeCenterX: 64,
        eyeCenterY: 33
    }
};


// =====================================================
// CANVAS
// =====================================================

const canvas =
    document.getElementById("mainCanvas");

const ctx =
    canvas.getContext("2d");


// =====================================================
// DRAW ROUNDED RECTANGLE
// =====================================================

function roundedRect(
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        width,
        height,
        radius
    );

    ctx.fill();
}


// =====================================================
// DRAW EXPRESSION
// =====================================================

function drawExpression(expression) {

    ctx.clearRect(
        0,
        0,
        128,
        64
    );


    // OLED background

    ctx.fillStyle = "black";

    ctx.fillRect(
        0,
        0,
        128,
        64
    );


    // Eye positions

    const leftX =
        expression.eyeCenterX -
        expression.eyeSpacing / 2;

    const rightX =
        expression.eyeCenterX +
        expression.eyeSpacing / 2;


    const y =
        expression.eyeCenterY -
        expression.eyeHeight / 2;


    // White eyes

    ctx.fillStyle = "white";


    roundedRect(
        leftX - expression.eyeWidth / 2,
        y,
        expression.eyeWidth,
        expression.eyeHeight,
        expression.cornerRadius
    );


    roundedRect(
        rightX - expression.eyeWidth / 2,
        y,
        expression.eyeWidth,
        expression.eyeHeight,
        expression.cornerRadius
    );


    // Pupils

    ctx.fillStyle = "black";


    ctx.beginPath();

    ctx.arc(
        leftX,
        expression.eyeCenterY,
        expression.pupilSize,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        rightX,
        expression.eyeCenterY,
        expression.pupilSize,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


// =====================================================
// SELECT PRESET
// =====================================================

function selectPreset(name) {

    currentExpression = {
        ...presets[name]
    };

    updateSliders();

    drawExpression(currentExpression);

    highlightPreset(name);
}


// =====================================================
// HIGHLIGHT SELECTED PRESET
// =====================================================

function highlightPreset(name) {

    document
        .querySelectorAll(".preset")
        .forEach(card => {

            card.classList.remove("active");

            if (card.dataset.preset === name) {
                card.classList.add("active");
            }
        });
}


// =====================================================
// CREATE PRESET CARDS
// =====================================================

function createPresetCards() {

    const container =
        document.getElementById("presetContainer");


    for (const key in presets) {

        const preset =
            presets[key];


        const card =
            document.createElement("div");

        card.className = "preset";

        card.dataset.preset = key;


        card.innerHTML = `

            <div class="preset-preview">

                <canvas
                    width="128"
                    height="64">
                </canvas>

            </div>

            <div class="preset-name">
                ${preset.name}
            </div>

            <div class="preset-description">
                ${preset.description}
            </div>

        `;


        card.onclick = () => {

            selectPreset(key);

        };


        container.appendChild(card);


        // Draw miniature preview

        const miniCanvas =
            card.querySelector("canvas");

        drawMiniPreview(
            miniCanvas,
            preset
        );
    }
}


// =====================================================
// MINI PREVIEW
// =====================================================

function drawMiniPreview(
    canvas,
    expression
) {

    const context =
        canvas.getContext("2d");


    context.fillStyle = "black";

    context.fillRect(
        0,
        0,
        128,
        64
    );


    const leftX =
        expression.eyeCenterX -
        expression.eyeSpacing / 2;

    const rightX =
        expression.eyeCenterX +
        expression.eyeSpacing / 2;


    const y =
        expression.eyeCenterY -
        expression.eyeHeight / 2;


    context.fillStyle = "white";


    context.beginPath();

    context.roundRect(
        leftX - expression.eyeWidth / 2,
        y,
        expression.eyeWidth,
        expression.eyeHeight,
        expression.cornerRadius
    );

    context.fill();


    context.beginPath();

    context.roundRect(
        rightX - expression.eyeWidth / 2,
        y,
        expression.eyeWidth,
        expression.eyeHeight,
        expression.cornerRadius
    );

    context.fill();


    context.fillStyle = "black";


    context.beginPath();

    context.arc(
        leftX,
        expression.eyeCenterY,
        expression.pupilSize,
        0,
        Math.PI * 2
    );

    context.fill();


    context.beginPath();

    context.arc(
        rightX,
        expression.eyeCenterY,
        expression.pupilSize,
        0,
        Math.PI * 2
    );

    context.fill();
}


// =====================================================
// SLIDERS
// =====================================================

const sliderNames = [

    "eyeWidth",
    "eyeHeight",
    "cornerRadius",
    "pupilSize",
    "eyeSpacing",
    "eyeCenterX",
    "eyeCenterY"
];


sliderNames.forEach(name => {

    const slider =
        document.getElementById(name);


    slider.addEventListener(
        "input",
        () => {

            currentExpression[name] =
                Number(slider.value);


            document
                .getElementById(name + "Value")
                .textContent =
                slider.value;


            drawExpression(
                currentExpression
            );
        }
    );
});


// =====================================================
// UPDATE SLIDERS
// =====================================================

function updateSliders() {

    sliderNames.forEach(name => {

        const slider =
            document.getElementById(name);


        slider.value =
            currentExpression[name];


        document
            .getElementById(name + "Value")
            .textContent =
            currentExpression[name];
    });
}


// =====================================================
// RESET
// =====================================================

function resetExpression() {

    selectPreset("neutral");
}


// =====================================================
// SEND TO MoMo
// =====================================================

function sendToMoMo() {

    console.log(
        "MoMo Expression:",
        currentExpression
    );


    alert(
        "Expression prepared for MoMo."
    );
}


// =====================================================
// START
// =====================================================

createPresetCards();

selectPreset("neutral");

</script>

</body>
</html>
